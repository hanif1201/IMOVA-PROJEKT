# Lokale Entwicklungsumgebung für IMOVA PROJEKT
# Start:  docker compose up -d   →  http://localhost:8080
# Setup:  ./bin/setup.sh  (installiert WordPress, aktiviert das Theme, legt Inhalte an)

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: imova
      MARIADB_USER: imova
      MARIADB_PASSWORD: imova
      MARIADB_ROOT_PASSWORD: imova-root
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:6-php8.3-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: imova
      WORDPRESS_DB_USER: imova
      WORDPRESS_DB_PASSWORD: imova
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/imova:/var/www/html/wp-content/themes/imova

  # WP-CLI für das Setup-Skript (wird nur bei Bedarf gestartet)
  cli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      - db
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: imova
      WORDPRESS_DB_USER: imova
      WORDPRESS_DB_PASSWORD: imova
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/imova:/var/www/html/wp-content/themes/imova

volumes:
  db_data:
  wp_data:
